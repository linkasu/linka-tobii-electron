name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --ignore-scripts
      - name: Test packed renderer and licensing files
        run: |
          mkdir .pack-test
          tar -xzf linkasu-tobii-electron-*.tgz -C .pack-test
          node --test .pack-test/package/tests/*.test.cjs
      - uses: softprops/action-gh-release@v2
        with:
          files: linkasu-tobii-electron-*.tgz
          generate_release_notes: true
